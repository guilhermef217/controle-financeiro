<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Financeiro - Lorranne</title>
    <!-- Google Fonts para um visual mais moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de Cores Moderna */
            --bg-color: #f8f9fa;
            --primary-color: #5e35b1; /* Roxo moderno */
            --primary-hover: #4527a0;
            --secondary-color: #7e57c2;
            --income-color: #10b981; /* Verde esmeralda */
            --income-hover: #059669;
            --expense-color: #ef4444; /* Vermelho suave */
            --expense-hover: #dc2626;
            --warning-color: #f59e0b; /* Laranja/Amarelo */
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            
            /* Espaçamentos e Bordas */
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        /* Container Principal */
        .container { 
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px 16px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
            padding: 20px 0;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        /* Dashboard Grid */
        .dashboard { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .card {
            background-color: var(--card-bg); 
            padding: 24px;
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .card h3 { 
            font-size: 0.875rem; 
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .card p { 
            font-size: clamp(1.5rem, 3vw, 1.875rem); 
            font-weight: 700; 
            margin-top: 12px; 
        }

        .text-income { color: var(--income-color) !important; }
        .text-expense { color: var(--expense-color) !important; }
        .text-warning { color: var(--warning-color) !important; }
        
        /* Form Section */
        .form-wrapper {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }

        .form-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            align-items: end;
        }

        .full-width { grid-column: 1 / -1; }
        
        @media (min-width: 768px) {
            .col-span-2 { grid-column: span 2; }
        }

        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 6px;
        }

        .form-group label { 
            font-weight: 500; 
            font-size: 0.875rem; 
            color: var(--text-muted); 
        }

        .form-group input, .form-group select {
            padding: 12px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-md); 
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
            width: 100%;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(94, 53, 177, 0.1);
        }

        button.btn-add {
            padding: 12px 24px; 
            background-color: var(--primary-color); 
            color: white;
            border: none; 
            border-radius: var(--radius-md); 
            cursor: pointer; 
            font-weight: 600;
            font-size: 1rem; 
            transition: background-color 0.2s; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        
        button.btn-add:hover { background-color: var(--primary-hover); }
        button.btn-add:active { transform: scale(0.98); }

        /* Tables & Lists */
        #tablesContainer { 
            display: flex; 
            flex-direction: column; 
            gap: 32px; 
        }
        
        .account-section {
            background-color: var(--card-bg); 
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md); 
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .account-header {
            background-color: var(--secondary-color); 
            color: white;
            padding: 16px 24px; 
            margin: 0; 
            font-size: 1.125rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left;
        }

        th { 
            background-color: #f9fafb; 
            color: var(--text-muted); 
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        td { 
            padding: 16px 24px; 
            border-bottom: 1px solid var(--border-color); 
            font-size: 0.95rem; 
            vertical-align: middle;
            color: var(--text-main);
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f9fafb; }

        .fw-bold { font-weight: 600; }

        /* Ações e Status */
        .is-paid { 
            text-decoration: line-through; 
            color: var(--text-muted) !important; 
            background-color: #f9fafb;
        }
        .is-paid .text-expense, .is-paid .text-income {
            color: var(--text-muted) !important;
        }
        
        .action-buttons { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px; 
            border-radius: 9999px;
            border: none; 
            cursor: pointer;
            font-weight: 500; 
            font-size: 0.875rem; 
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-status { color: white; min-width: 100px; }
        .status-pendente { background-color: var(--expense-color); }
        .status-pendente:hover { background-color: var(--expense-hover); }
        .status-pago { background-color: var(--income-color); }
        .status-pago:hover { background-color: var(--income-hover); }

        .btn-icon {
            background-color: transparent; 
            border: 1px solid var(--border-color); 
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: var(--radius-md);
        }
        
        .btn-edit:hover { background-color: #f0f9ff; color: #0369a1; border-color: #0369a1; }
        .btn-delete:hover { background-color: #fef2f2; color: var(--expense-color); border-color: var(--expense-color); }

        .account-footer {
            background-color: #f9fafb; 
            padding: 16px 24px; 
            display: flex;
            justify-content: space-between; 
            align-items: center;
            flex-wrap: wrap; 
            gap: 12px;
            border-top: 1px solid var(--border-color);
        }
        
        .footer-item { font-size: 0.95rem; color: var(--text-muted); }
        .footer-item strong { margin-left: 4px; font-size: 1.05rem; }

        /* Media Queries para Responsividade (Mobile First / Cards) */
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr 1fr; }
            
            thead { display: none; }
            
            table, tbody, tr, td {
                display: block;
                width: 100%;
            }
            
            tr {
                border-bottom: 1px solid var(--border-color);
                padding: 16px;
                position: relative;
            }
            
            td {
                padding: 8px 0;
                border-bottom: none;
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
            }
            
            td::before {
                content: attr(data-label);
                float: left;
                font-weight: 600;
                color: var(--text-muted);
                text-transform: uppercase;
                font-size: 0.75rem;
                letter-spacing: 0.05em;
            }

            .action-buttons {
                justify-content: flex-end;
                width: 100%;
                margin-top: 8px;
                padding-top: 8px;
                border-top: 1px dashed var(--border-color);
            }
            
            td:last-child {
                flex-direction: column;
                align-items: flex-end;
            }

            .account-footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        @media (max-width: 480px) {
            .dashboard { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.75rem; }
            .form-wrapper { padding: 16px; }
            .card { padding: 16px; }
        }

        #installmentsDiv {
            transition: all 0.3s ease;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Controle Financeiro</h1>
        <p>Lorranne • Gestão Inteligente e Responsiva</p>
    </div>

    <!-- Dashboard -->
    <div class="dashboard">
        <div class="card" style="border-top-color: var(--income-color);">
            <h3>Receitas Mensais</h3>
            <p class="text-income" id="dashIncome">R$ 0,00</p>
        </div>
        <div class="card" style="border-top-color: var(--expense-color);">
            <h3>Contas Pendentes</h3>
            <p class="text-expense" id="dashPending">R$ 0,00</p>
        </div>
        <div class="card" style="border-top-color: var(--primary-color);">
            <h3>Já Pago</h3>
            <p class="text-income" id="dashPaid">R$ 0,00</p>
        </div>
        <div class="card" style="border-top-color: var(--warning-color);">
            <h3>Dívida Total</h3>
            <p class="text-warning" id="dashTotal">R$ 0,00</p>
        </div>
    </div>

    <!-- Formulário para Adicionar -->
    <div class="form-wrapper">
        <div class="form-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            Novo Lançamento
        </div>
        <form class="form-grid" id="transactionForm">
            <div class="form-group col-span-2">
                <label for="account">Conta / Instituição</label>
                <input type="text" id="account" placeholder="Ex: Nubank, Bemol, Salário..." list="accountOptions" required>
                <datalist id="accountOptions">
                    <option value="Nubank - Contas">
                    <option value="Nubank - Empréstimo">
                    <option value="Bemol - Empréstimo">
                    <option value="Bemol - Dividida">
                    <option value="Carrefour - Contas">
                    <option value="Entradas / Receitas">
                </datalist>
            </div>
            
            <div class="form-group">
                <label for="recurrence">Repetição</label>
                <select id="recurrence" onchange="toggleInstallments()">
                    <option value="unica">Mês Único</option>
                    <option value="parcelada">Parcelado (Vários Meses)</option>
                </select>
            </div>

            <div class="form-group" id="installmentsDiv" style="display: none;">
                <label for="installmentsCount">Qtd. Parcelas</label>
                <input type="number" id="installmentsCount" min="2" value="2">
            </div>

            <div class="form-group col-span-2" id="installmentLabelDiv">
                <label for="installment">Descrição / Mês</label>
                <input type="text" id="installment" placeholder="Ex: Setembro, Compra Celular..." required>
            </div>

            <div class="form-group">
                <label for="date">Vencimento (1ª Parc)</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="amount">Valor (R$)</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required>
            </div>
            
            <div class="form-group">
                <label for="type">Tipo de Lançamento</label>
                <select id="type">
                    <option value="saida">Saída (Pagar)</option>
                    <option value="entrada">Entrada (Receber)</option>
                </select>
            </div>
            
            <div class="form-group full-width" style="margin-top: 8px;">
                <button type="submit" class="btn-add">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
                    Salvar Lançamento
                </button>
            </div>
        </form>
    </div>

    <!-- Tabelas -->
    <div id="tablesContainer"></div>
</div>

                    || JSON.parse(localStorage.getItem('lorranne_finances_v3')) 
                    || initialData;

    let transactions = savedData;

    const tablesContainer = document.getElementById('tablesContainer');
    const form = document.getElementById('transactionForm');

    // Funções de formatação
    const formatCurrency = (value) => {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    };
    
    const formatDate = (dateString) => {
        if(!dateString) return '';
        const parts = dateString.split('-');
        if(parts.length !== 3) return dateString;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    };

    // UI interativa (Formulário)
    window.toggleInstallments = function() {
        const rec = document.getElementById('recurrence').value;

            tablesContainer.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--text-muted); background: var(--card-bg); border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px; opacity: 0.5;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <p>Nenhum lançamento encontrado.<br>Adicione contas no formulário acima para começar.</p>
                </div>
            `;
        }

        // Agrupar por Conta
        const groupedData = transactions.reduce((acc, curr) => {
            const key = curr.type === 'entrada' ? 'Entradas / Receitas' : curr.account;
            if (!acc[key]) acc[key] = [];
            acc[key].push(curr);
            return acc;
        }, {});

        const categories = Object.keys(groupedData).sort();

        categories.forEach(category => {
            let catTotal = 0, catPaid = 0, catPending = 0;
            const items = groupedData[category];
            const isIncomeGroup = category === 'Entradas / Receitas';

            items.sort((a, b) => new Date(a.date) - new Date(b.date));

            const section = document.createElement('div');
            section.className = 'account-section';

            let tableRows = '';
            
            items.forEach(item => {
                if(!item.status) item.status = 'pendente';

                if (item.type === 'entrada') {
                    dashIncome += item.amount;
                } else {
                    dashTotal += item.amount;
                    if (item.status === 'pago') dashPaid += item.amount;
                    else dashPending += item.amount;
                }
                
                catTotal += item.amount;
                if (item.status === 'pago') catPaid += item.amount;
                else catPending += item.amount;

                const isPaid = item.status === 'pago';
                const rowClass = isPaid ? 'is-paid' : '';
                const btnClass = isPaid ? 'status-pago' : 'status-pendente';
                const btnText = isPaid ? 'Pago ✓' : 'Pendente';
                const amountColor = item.type === 'entrada' ? 'text-income' : 'text-expense';

                tableRows += `
                    <tr class="${rowClass}">
                        <td width="20%" data-label="Vencimento">${formatDate(item.date)}</td>
                        <td width="30%" data-label="Descrição" class="fw-bold">${item.installment}</td>
                        <td width="20%" data-label="Valor" class="${!isPaid ? amountColor : ''} fw-bold">${formatCurrency(item.amount)}</td>
                        <td width="30%" data-label="Ações">
                            <div class="action-buttons">
                                <button class="btn btn-status ${btnClass}" onclick="toggleStatus(${item.id})">${btnText}</button>
                                <button class="btn btn-icon btn-edit" onclick="editAmount(${item.id})" title="Alterar Valor">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </button>
                                <button class="btn btn-icon btn-delete" onclick="deleteTransaction(${item.id})" title="Excluir Parcela">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            let footerHTML = isIncomeGroup 
                ? `<div class="footer-item">Total Registrado: <strong class="text-income">${formatCurrency(catTotal)}</strong></div>`
                : `<div class="footer-item">Total da Conta: <strong>${formatCurrency(catTotal)}</strong></div>
                   <div class="footer-item">Já Pago: <strong class="text-income">${formatCurrency(catPaid)}</strong></div>
                   <div class="footer-item">A Pagar: <strong class="text-expense">${formatCurrency(catPending)}</strong></div>`;

            section.innerHTML = `
                <h3 class="account-header">
                    ${category}
                    <span style="font-size: 0.85rem; font-weight: 500; opacity: 0.9;">${items.length} item(s)</span>
                </h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Vencimento</th>
                                <th>Descrição / Mês</th>
                                <th>Valor</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
                <div class="account-footer">${footerHTML}</div>
            `;
            tablesContainer.appendChild(section);
        });

        // Atualiza os painéis numéricos
        document.getElementById('dashIncome').textContent = formatCurrency(dashIncome);
        document.getElementById('dashPending').textContent = formatCurrency(dashPending);
        document.getElementById('dashPaid').textContent = formatCurrency(dashPaid);
        document.getElementById('dashTotal').textContent = formatCurrency(dashTotal);

        // Salvar tudo de forma segura no navegador!
        localStorage.setItem('lorranne_finances_v5', JSON.stringify(transactions));
    }

    // Ação: Editar
    window.editAmount = function(id) {
        const item = transactions.find(t => t.id === id);
        if(item) {
            let newVal = prompt(`Qual o NOVO VALOR para (${item.installment}) de ${item.account}? \n\nUse ponto ou vírgula para centavos:`, item.amount);
            if (newVal !== null) {
                newVal = newVal.replace(',', '.');
                const parsed = parseFloat(newVal);
                if (!isNaN(parsed) && parsed >= 0) {
                    item.amount = parsed;
                    updateUI();
                } else {
                    alert("Valor inválido. Digite apenas números.");
                }
            }
        }
    };

    // Ação: Mudar Status (Pendente/Pago)
    window.toggleStatus = function(id) {
        const item = transactions.find(t => t.id === id);
        if(item) {
            item.status = item.status === 'pendente' ? 'pago' : 'pendente';
            updateUI();
        }
    };

    function addMonthsToDate(dateStr, monthsToAdd) {
        let [y, m, d] = dateStr.split('-');
        let date = new Date(y, parseInt(m)-1, d);
        date.setMonth(date.getMonth() + monthsToAdd);
        
        let outY = date.getFullYear();
        let outM = String(date.getMonth() + 1).padStart(2, '0');
        let outD = String(date.getDate()).padStart(2, '0');
        return `${outY}-${outM}-${outD}`;
    }

    // Ação: Adicionar Lançamento
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const account = document.getElementById('account').value.trim();
        const descText = document.getElementById('installment').value.trim();
        const dateStr = document.getElementById('date').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('type').value;
        const recurrence = document.getElementById('recurrence').value;

        if (recurrence === 'unica') {
            transactions.push({
                id: Date.now(),
                account, 
                installment: descText, 
                date: dateStr, 
                amount, 
                type, 
                status: 'pendente'
            });
        } else {
            const count = parseInt(document.getElementById('installmentsCount').value);
            const baseId = Date.now();
            for(let i = 1; i <= count; i++) {
                let nextDate = addMonthsToDate(dateStr, i - 1);
                transactions.push({
                    id: baseId + i,
                    account,
                    installment: `${descText} (Parc. ${i}/${count})`,
                    date: nextDate,
                    amount, 
                    type, 
                    status: 'pendente'
                });
            }
        }
        
        updateUI();
        
        document.getElementById('installment').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('recurrence').value = 'unica';
        toggleInstallments();
        document.getElementById('installment').focus();
    });

    // Ação: Excluir
    window.deleteTransaction = function(id) {
        if(confirm('Tem certeza que deseja excluir esta parcela permanentemente?')) {
            transactions = transactions.filter(t => t.id !== id);
            updateUI();
        }
    };

    // Inicia tudo no carregamento
    document.getElementById('date').valueAsDate = new Date();
    updateUI();
</script>

</body>
</html>
