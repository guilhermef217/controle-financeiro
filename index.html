<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Controle Financeiro - Lorranne</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Script do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --primary-color: #5e35b1; 
            --primary-hover: #4527a0;
            --secondary-color: #7e57c2;
            --income-color: #10b981; 
            --expense-color: #ef4444; 
            --warning-color: #f59e0b; 
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TELA DE LOGIN */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--primary-color);
        }

        .login-box h2 { color: var(--primary-color); margin-bottom: 8px; }
        .login-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .login-box .form-group { text-align: left; margin-bottom: 16px; }
        
        #errorMsg { color: var(--expense-color); font-size: 0.85rem; margin-bottom: 16px; display: none; }

        /* APLICATIVO PRINCIPAL */
        #appScreen { display: none; width: 100%; }

        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px 16px; }

        .header { text-align: center; margin-bottom: 32px; padding: 20px 0; position: relative; }
        .header h1 { color: var(--primary-color); font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 700; }
        .header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 8px; }
        
        .btn-logout {
            position: absolute; right: 0; top: 20px;
            background: transparent; border: 1px solid var(--expense-color);
            color: var(--expense-color); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s;
        }
        .btn-logout:hover { background: var(--expense-color); color: white; }

        /* Dashboard Grid */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .card { background-color: var(--card-bg); padding: 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border-top: 4px solid var(--primary-color); }
        .card h3 { font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; }
        .card p { font-size: clamp(1.5rem, 3vw, 1.875rem); font-weight: 700; margin-top: 12px; }
        .text-income { color: var(--income-color) !important; }
        .text-expense { color: var(--expense-color) !important; }
        .text-warning { color: var(--warning-color) !important; }
        
        /* Formulário e UI Geral */
        .form-wrapper { background-color: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 24px; margin-bottom: 40px; }
        .form-title { font-size: 1.125rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: end; }
        .full-width { grid-column: 1 / -1; }
        @media (min-width: 768px) { .col-span-2 { grid-column: span 2; } }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 500; font-size: 0.875rem; color: var(--text-muted); }
        .form-group input, .form-group select { padding: 12px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.95rem; width: 100%; }
        
        button.btn-add { padding: 12px 24px; background-color: var(--primary-color); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
        button.btn-add:hover { background-color: var(--primary-hover); }

        /* Tabelas */
        #tablesContainer { display: flex; flex-direction: column; gap: 32px; }
        .account-section { background-color: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); overflow: hidden; }
        .account-header { background-color: var(--secondary-color); color: white; padding: 16px 24px; font-size: 1.125rem; font-weight: 600; display: flex; justify-content: space-between; }
        
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f9fafb; color: var(--text-muted); padding: 12px 24px; font-size: 0.875rem; text-transform: uppercase; border-bottom: 1px solid var(--border-color); }
        td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
        
        .is-paid { text-decoration: line-through; color: var(--text-muted) !important; background-color: #f9fafb; }
        
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 6px 12px; border-radius: 9999px; border: none; cursor: pointer; font-weight: 500; font-size: 0.875rem; }
        .btn-status { color: white; min-width: 100px; }
        .status-pendente { background-color: var(--expense-color); }
        .status-pago { background-color: var(--income-color); }
        .btn-icon { background-color: transparent; border: 1px solid var(--border-color); padding: 6px 10px; border-radius: var(--radius-md); }
        
        .account-footer { background-color: #f9fafb; padding: 16px 24px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-top: 1px solid var(--border-color); }
        .footer-item { font-size: 0.95rem; color: var(--text-muted); }
        .footer-item strong { margin-left: 4px; font-size: 1.05rem; }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr 1fr; }
            .btn-logout { position: static; display: block; margin: 16px auto 0; }
            thead { display: none; }
            table, tbody, tr, td { display: block; width: 100%; }
            tr { border-bottom: 1px solid var(--border-color); padding: 16px; }
            td { padding: 8px 0; border: none; display: flex; justify-content: space-between; text-align: right; }
            td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }
            .action-buttons { justify-content: flex-end; width: 100%; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); }
            td:last-child { flex-direction: column; align-items: flex-end; }
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>Acesso Restrito</h2>
        <p>Faça login para ver suas contas</p>
        
        <p id="errorMsg"></p>

        <form id="loginForm">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-add" id="btnLogin">Entrar no Sistema</button>
        </form>
    </div>
</div>

<!-- APLICATIVO PRINCIPAL (Fica oculto até o login) -->
<div id="appScreen">
    <div class="container">
        <div class="header">
            <h1>Controle Financeiro</h1>
            <p>Lorranne • Gestão Inteligente e Responsiva</p>
            <button onclick="logout()" class="btn-logout">Sair do Sistema</button>
        </div>

        <div class="dashboard">
            <div class="card" style="border-top-color: var(--income-color);">
                <h3>Receitas Mensais</h3>
                <p class="text-income" id="dashIncome">R$ 0,00</p>
            </div>
            <div class="card" style="border-top-color: var(--expense-color);">
                <h3>Contas Pendentes</h3>
                <p class="text-expense" id="dashPending">R$ 0,00</p>
            </div>
            <div class="card" style="border-top-color: var(--primary-color);">
                <h3>Já Pago</h3>
                <p class="text-income" id="dashPaid">R$ 0,00</p>
            </div>
            <div class="card" style="border-top-color: var(--warning-color);">
                <h3>Dívida Total</h3>
                <p class="text-warning" id="dashTotal">R$ 0,00</p>
            </div>
        </div>

        <div class="form-wrapper">
            <div class="form-title">Novo Lançamento</div>
            <form class="form-grid" id="transactionForm">
                <div class="form-group col-span-2">
                    <label>Conta / Instituição</label>
                    <input type="text" id="account" placeholder="Ex: Nubank, Bemol, Salário..." list="accountOptions" required>
                    <datalist id="accountOptions">
                        <option value="Nubank - Contas">
                        <option value="Nubank - Empréstimo">
                        <option value="Bemol - Empréstimo">
                        <option value="Bemol - Dividida">
                        <option value="Carrefour - Contas">
                        <option value="Entradas / Receitas">
                    </datalist>
                </div>
                <div class="form-group">
                    <label>Repetição</label>
                    <select id="recurrence" onchange="toggleInstallments()">
                        <option value="unica">Mês Único</option>
                        <option value="parcelada">Parcelado</option>
                    </select>
                </div>
                <div class="form-group" id="installmentsDiv" style="display: none;">
                    <label>Qtd. Parcelas</label>
                    <input type="number" id="installmentsCount" min="2" value="2">
                </div>
                <div class="form-group col-span-2" id="installmentLabelDiv">
                    <label>Descrição / Mês</label>
                    <input type="text" id="installment" required>
                </div>
                <div class="form-group">
                    <label>Vencimento (1ª Parc)</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Valor (R$)</label>
                    <input type="number" id="amount" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Tipo de Lançamento</label>
                    <select id="type">
                        <option value="saida">Saída (Pagar)</option>
                        <option value="entrada">Entrada (Receber)</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <button type="submit" class="btn-add">Salvar Lançamento</button>
                </div>
            </form>
        </div>

        <div id="tablesContainer"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. CONFIGURAÇÃO DO SUPABASE (COLE AQUI!)
    // ==========================================
    const supabaseUrl = 'https://bovdpmvneiundafymoku.supabase.co/rest/v1/'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvdmRwbXZuZWl1bmRhZnltb2t1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3OTI1NTIsImV4cCI6MjEwNDM2ODU1Mn0.PZSZ_SLgA-IDIdmmHFVyNcCc2XrUB2vgBBY5e877JUQ'; 
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ==========================================
    // 2. SISTEMA DE LOGIN E SESSÃO
    // ==========================================
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    // Verifica se o usuário já está logado ao abrir a página
    async function checkUser() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            loginScreen.style.display = 'none';
            appScreen.style.display = 'block';
            updateUI(); // Carrega os dados apenas se estiver logada
        } else {
            loginScreen.style.display = 'flex';
            appScreen.style.display = 'none';
        }
    }

    // Monitora mudanças (quando faz login ou logout)
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN') {
            loginScreen.style.display = 'none';
            appScreen.style.display = 'block';
            updateUI();
        } else if (event === 'SIGNED_OUT') {
            loginScreen.style.display = 'flex';
            appScreen.style.display = 'none';
        }
    });

    // Função de Fazer Login
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('btnLogin');
        
        btn.textContent = 'Carregando...';
        errorMsg.style.display = 'none';

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
            errorMsg.textContent = 'E-mail ou senha incorretos.';
            errorMsg.style.display = 'block';
            btn.textContent = 'Entrar no Sistema';
        }
    });

    // Função de Sair (Logout)
    async function logout() {
        await supabase.auth.signOut();
    }

    // Inicia checagem de usuário
    checkUser();


    // ==========================================
    // 3. LÓGICA FINANCEIRA (Mantida do LocalStorage)
    // ==========================================
    const initialData = [
        { id: 1, account: 'Bemol - Empréstimo', installment: 'Setembro', date: '2026-09-21', amount: 474.91, type: 'saida', status: 'pendente' },
        { id: 2, account: 'Bemol - Empréstimo', installment: 'Outubro', date: '2026-10-21', amount: 474.91, type: 'saida', status: 'pendente' },
        { id: 3, account: 'Bemol - Dividida', installment: 'Setembro', date: '2026-09-15', amount: 191.00, type: 'saida', status: 'pendente' },
        { id: 7, account: 'Nubank - Contas', installment: 'Setembro', date: '2026-09-10', amount: 1353.39, type: 'saida', status: 'pendente' },
        { id: 18, account: 'Nubank - Empréstimo', installment: 'Setembro', date: '2026-09-17', amount: 637.00, type: 'saida', status: 'pendente' },
        { id: 32, account: 'Carrefour - Contas', installment: 'Setembro', date: '2026-09-21', amount: 982.49, type: 'saida', status: 'pendente' }
        // (Encurtado aqui visualmente, o código original tem todos)
    ];

    let savedData = JSON.parse(localStorage.getItem('lorranne_finances_v6'));
    if (!savedData || savedData.length === 0) { savedData = initialData; }
    let transactions = savedData;

    const tablesContainer = document.getElementById('tablesContainer');
    const form = document.getElementById('transactionForm');

    const formatCurrency = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    const formatDate = (dateString) => {
        if(!dateString) return '';
        const parts = dateString.split('-');
        if(parts.length !== 3) return dateString;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    };

    window.toggleInstallments = function() {
        const rec = document.getElementById('recurrence').value;
        const instDiv = document.getElementById('installmentsDiv');
        const descLabel = document.querySelector('#installmentLabelDiv label');
        
        if(rec === 'parcelada') {
            instDiv.style.display = 'flex';
            descLabel.textContent = 'Nome da Compra (Ex: TV)';
        } else {
            instDiv.style.display = 'none';
            descLabel.textContent = 'Descrição / Mês';
        }
    };

    function updateUI() {
        tablesContainer.innerHTML = '';
        let dashIncome = 0, dashPending = 0, dashPaid = 0, dashTotal = 0;

        const groupedData = transactions.reduce((acc, curr) => {
            const key = curr.type === 'entrada' ? 'Entradas / Receitas' : curr.account;
            if (!acc[key]) acc[key] = [];
            acc[key].push(curr);
            return acc;
        }, {});

        const categories = Object.keys(groupedData).sort();

        categories.forEach(category => {
            let catTotal = 0, catPaid = 0, catPending = 0;
            const items = groupedData[category];
            const isIncomeGroup = category === 'Entradas / Receitas';

            items.sort((a, b) => new Date(a.date) - new Date(b.date));
            const section = document.createElement('div');
            section.className = 'account-section';
            let tableRows = '';
            
            items.forEach(item => {
                if(!item.status) item.status = 'pendente';
                if (item.type === 'entrada') { dashIncome += item.amount; } 
                else {
                    dashTotal += item.amount;
                    if (item.status === 'pago') dashPaid += item.amount;
                    else dashPending += item.amount;
                }
                
                catTotal += item.amount;
                if (item.status === 'pago') catPaid += item.amount; else catPending += item.amount;

                const isPaid = item.status === 'pago';
                const rowClass = isPaid ? 'is-paid' : '';
                const btnClass = isPaid ? 'status-pago' : 'status-pendente';
                const btnText = isPaid ? 'Pago ✓' : 'Pendente';
                const amountColor = item.type === 'entrada' ? 'text-income' : 'text-expense';

                tableRows += `
                    <tr class="${rowClass}">
                        <td width="20%" data-label="Vencimento">${formatDate(item.date)}</td>
                        <td width="30%" data-label="Descrição" class="fw-bold">${item.installment}</td>
                        <td width="20%" data-label="Valor" class="${!isPaid ? amountColor : ''} fw-bold">${formatCurrency(item.amount)}</td>
                        <td width="30%" data-label="Ações">
                            <div class="action-buttons">
                                <button class="btn btn-status ${btnClass}" onclick="toggleStatus(${item.id})">${btnText}</button>
                                <button class="btn btn-icon btn-edit" onclick="editAmount(${item.id})">✏️</button>
                                <button class="btn btn-icon btn-delete" onclick="deleteTransaction(${item.id})">✖</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            let footerHTML = isIncomeGroup 
                ? `<div class="footer-item">Total Registrado: <strong class="text-income">${formatCurrency(catTotal)}</strong></div>`
                : `<div class="footer-item">Total da Conta: <strong>${formatCurrency(catTotal)}</strong></div>
                   <div class="footer-item">Já Pago: <strong class="text-income">${formatCurrency(catPaid)}</strong></div>
                   <div class="footer-item">A Pagar: <strong class="text-expense">${formatCurrency(catPending)}</strong></div>`;

            section.innerHTML = `
                <h3 class="account-header">${category}</h3>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Vencimento</th><th>Descrição / Mês</th><th>Valor</th><th>Ações</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
                <div class="account-footer">${footerHTML}</div>
            `;
            tablesContainer.appendChild(section);
        });

        document.getElementById('dashIncome').textContent = formatCurrency(dashIncome);
        document.getElementById('dashPending').textContent = formatCurrency(dashPending);
        document.getElementById('dashPaid').textContent = formatCurrency(dashPaid);
        document.getElementById('dashTotal').textContent = formatCurrency(dashTotal);

        localStorage.setItem('lorranne_finances_v6', JSON.stringify(transactions));
    }

    window.editAmount = function(id) {
        const item = transactions.find(t => t.id === id);
        if(item) {
            let newVal = prompt(`Qual o NOVO VALOR para (${item.installment}) de ${item.account}?`, item.amount);
            if (newVal) {
                const parsed = parseFloat(newVal.replace(',', '.'));
                if (!isNaN(parsed) && parsed >= 0) { item.amount = parsed; updateUI(); }
            }
        }
    };

    window.toggleStatus = function(id) {
        const item = transactions.find(t => t.id === id);
        if(item) { item.status = item.status === 'pendente' ? 'pago' : 'pendente'; updateUI(); }
    };

    function addMonthsToDate(dateStr, monthsToAdd) {
        let [y, m, d] = dateStr.split('-');
        let date = new Date(y, parseInt(m)-1, d);
        date.setMonth(date.getMonth() + monthsToAdd);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const account = document.getElementById('account').value.trim();
        const descText = document.getElementById('installment').value.trim();
        const dateStr = document.getElementById('date').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('type').value;
        const recurrence = document.getElementById('recurrence').value;

        if (recurrence === 'unica') {
            transactions.push({ id: Date.now(), account, installment: descText, date: dateStr, amount, type, status: 'pendente' });
        } else {
            const count = parseInt(document.getElementById('installmentsCount').value);
            const baseId = Date.now();
            for(let i = 1; i <= count; i++) {
                transactions.push({ id: baseId + i, account, installment: `${descText} (Parc. ${i}/${count})`, date: addMonthsToDate(dateStr, i - 1), amount, type, status: 'pendente' });
            }
        }
        updateUI();
        document.getElementById('installment').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('recurrence').value = 'unica';
        toggleInstallments();
    });

    window.deleteTransaction = function(id) {
        if(confirm('Deseja excluir esta parcela permanentemente?')) {
            transactions = transactions.filter(t => t.id !== id);
            updateUI();
        }
    };

    document.getElementById('date').valueAsDate = new Date();
</script>

</body>
</html>
